# Wizard.yml -- example SPECWIZARD configuration (EAGLE snapshot).
# Replace the /path/to/... entries with the locations on your system.
# See the "Configuration file" page of the docs for every option.

file_type:
    sim_type: eagle
    snap_type: snapshot

snapshot_params:
    # On COSMA: /cosma7/data/Eagle/ScienceRuns/Planck1/L0100N1504/PE/REFERENCE/data/snapshot_019_z001p004
    directory: /path/to/snapshot_019_z001p004
    file: snap_019_z001p004.0.hdf5

sightline:
    ProjectionAxes: ['simx','simy','simz']
    ProjectionStart: [0.5,0.5,0]
    ProjectionLength: 1
    SightLength: null
    ProjectionExtend:
        extend: False
        extendfactor: 3
    nsight: 0

ionparams:
    table_type: specwizard_cloudy
    iondir: /path/to/ion_tables/HM12/
    fname: null
    ions: [['Hydrogen', 'H I'],['Helium','He II'],['Carbon','C III'],['Carbon','C IV'],['Oxygen','O VI'],['Silicon','Si IV']]
    SFR_properties:
        modify_particle: True
        ignore_particle: False
        Temperature [K]: 1.0E+4    # Keep the "+" in the exponent, otherwise YAML reads it as a string.
    atomfile: /path/to/atomic_info.hdf5

ODParams:
    VelOffset_kms: 0
    PecVelEffectsOff: False
    ThermalEffectsOff: False
    VoigtOff: True

LongSpectra:
    lambda_min: 300.0
    lambda_max: 8000.0
    dlambda: 0.5
    z_qsr: 3.2
    delta_z: 0.1
    all_contaminants: True
    # On COSMA: /cosma7/data/Eagle/ScienceRuns/Planck1/L0100N1504/PE/REFERENCE/data/los/
    file_dir: /path/to/los/
